version: '3.8'

services:
  monitor_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-monitordb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5433:5432"
    networks:
      - uptime_local_net

  monitor_redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - uptime_local_net

  uptime_app:
    build: .
    ports:
      - "8081:8081"
    depends_on:
      - monitor_db
      - monitor_redis
    environment:
      - DB_HOST=monitor_db
      - DB_PORT=5432
      - REDIS_HOST=monitor_redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=monitor_kafka:29092
      - DB_NAME=${DB_NAME:-monitordb}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
    networks:
      - uptime_local_net
      - shared_kafka_net

networks:
  uptime_local_net:
    driver: bridge
  shared_kafka_net:
    external: true
    name: shared_kafka_network